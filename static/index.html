<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentic RAG</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; color: #1c1c1c; }
    aside { width: 280px; border-right: 1px solid #ddd; padding: 1rem; overflow-y: auto; background: #fafafa; }
    main { flex: 1; padding: 1.25rem 1.5rem; overflow-y: auto; }
    h1 { font-size: 1.1rem; margin: 0 0 .75rem; }
    h2 { font-size: 1.15rem; margin: 0; }
    .ws { padding: .5rem .6rem; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: .5rem; }
    .ws:hover { background: #eee; }
    .ws.active { background: #e3ecff; font-weight: 600; }
    .muted { color: #666; font-size: .85rem; }
    .row { display: flex; gap: .5rem; margin: .75rem 0; align-items: center; flex-wrap: wrap; }
    input[type=text] { flex: 1; min-width: 0; padding: .4rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid #eee; font-size: .9rem; }
    .st-done { color: #1b7f3b; }
    .st-failed { color: #b00020; }
    .st-pending, .st-processing { color: #8a5a00; }
    .st-running { color: #8a5a00; }
    .chip { display: inline-block; margin: 0 .3rem .2rem 0; padding: .05rem .45rem;
            border: 1px solid currentColor; border-radius: 999px; font-size: .75rem; }
    #note { color: #8a5a00; margin: .25rem 0; }
    #err, #wsErr { color: #b00020; margin: .25rem 0; font-size: .9rem; }
    #md { white-space: pre-wrap; background: #f4f4f4; padding: 1rem; border-radius: 6px;
          max-height: 50vh; overflow: auto; display: none; margin-top: 1rem; }
    .hidden { display: none; }
    @media (max-width: 700px) {
      body { flex-direction: column; height: auto; }
      aside { width: 100%; border-right: 0; border-bottom: 1px solid #ddd; }
    }
  </style>
</head>
<body>
  <aside>
    <h1>Workspaces</h1>
    <div id="wsList"></div>
    <div class="row">
      <input type="text" id="wsName" placeholder="New workspace name" maxlength="80">
      <button id="wsCreate">Create</button>
    </div>
    <div id="wsErr"></div>
    <p class="muted">Each workspace keeps its own documents. Do not upload confidential files: everything is deleted after 24 hours.</p>
  </aside>

  <main>
    <div id="empty" class="muted">Create a workspace to get started.</div>

    <div id="panel" class="hidden">
      <div class="row" style="justify-content: space-between">
        <h2 id="wsTitle"></h2>
        <button id="wsDelete">Delete workspace</button>
      </div>

      <div class="row">
        <input type="file" id="file">
        <button id="upload">Upload</button>
      </div>
      <div id="note"></div>
      <button id="force" class="hidden">Re-upload and replace previous</button>
      <div id="err"></div>

      <table>
        <thead><tr><th>File</th><th>Status</th><th>Stage</th><th>Steps</th><th></th></tr></thead>
        <tbody id="docs"></tbody>
      </table>
      <div class="row">
        <button id="showEvents">Show events</button>
        <input type="text" id="graphQ" placeholder="Filter graph by name (optional)" maxlength="100">
        <button id="showGraph">Show graph</button>
      </div>
      <div id="view"></div>
      <pre id="md"></pre>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let currentWs = null;   // the selected workspace
    let pollTimer = null;

    async function api(path, opts = {}) {
      const res = await fetch(path, opts);
      let data = null;
      try { data = await res.json(); } catch (e) {}
      if (!res.ok) {
        const detail = data && typeof data.detail === "string" ? data.detail : "Request failed (" + res.status + ")";
        throw new Error(detail);
      }
      return data;
    }

    // Build elements with textContent, never innerHTML: filenames and errors come from users.
    function el(tag, text, cls) {
      const e = document.createElement(tag);
      if (text !== undefined) e.textContent = text;
      if (cls) e.className = cls;
      return e;
    }

    function showErr(e) { $("err").textContent = e.message || String(e); }
    function clearMessages() {
      $("note").textContent = "";
      $("err").textContent = "";
      $("force").classList.add("hidden");
    }
    function resetPanel() {
      clearMessages();
      $("md").style.display = "none";
      $("md").textContent = "";
      $("view").replaceChildren();
      $("docs").replaceChildren();
      $("file").value = "";
    }
    function showPanel(show) {
      $("empty").classList.toggle("hidden", show);
      $("panel").classList.toggle("hidden", !show);
    }
    function stopPolling() { clearTimeout(pollTimer); }
    function schedulePoll(busy) {
      stopPolling();
      if (busy) pollTimer = setTimeout(() => loadDocs().catch(showErr), 2000);
    }

    // ---------- workspaces ----------
    function renderWorkspaces(list) {
      const box = $("wsList");
      box.replaceChildren();
      list.forEach((w) => {
        const active = currentWs && currentWs.workspace_id === w.workspace_id;
        const row = el("div", "", active ? "ws active" : "ws");
        row.append(el("span", w.name), el("span", w.documents + " file(s)", "muted"));
        row.onclick = () => refreshWorkspaces(w.workspace_id).catch(showErr);
        box.appendChild(row);
      });
    }

    async function refreshWorkspaces(preferId) {
      const list = await api("/workspaces");
      const pick =
        list.find((w) => w.workspace_id === preferId) ||
        list.find((w) => currentWs && w.workspace_id === currentWs.workspace_id) ||
        list[0] || null;

      if (!pick) {
        currentWs = null;
        stopPolling();
        renderWorkspaces(list);
        showPanel(false);
        return;
      }
      const changed = !currentWs || currentWs.workspace_id !== pick.workspace_id;
      currentWs = pick;
      renderWorkspaces(list);
      showPanel(true);
      $("wsTitle").textContent = pick.name;
      if (changed) {
        stopPolling();
        resetPanel();
        await loadDocs();
      }
    }

    $("wsCreate").onclick = async () => {
      $("wsErr").textContent = "";
      try {
        const ws = await api("/workspaces", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: $("wsName").value || "My workspace" }),
        });
        $("wsName").value = "";
        await refreshWorkspaces(ws.workspace_id);
      } catch (e) { $("wsErr").textContent = e.message; }
    };

    $("wsDelete").onclick = async () => {
      if (!currentWs || !confirm('Delete "' + currentWs.name + '" and all its documents?')) return;
      try {
        await api("/workspaces/" + currentWs.workspace_id, { method: "DELETE" });
        currentWs = null;
        stopPolling();
        await refreshWorkspaces();
      } catch (e) { showErr(e); }
    };

    // ---------- documents ----------
    async function loadDocs() {
      if (!currentWs) return;
      const wsId = currentWs.workspace_id;
      const docs = await api("/workspaces/" + wsId + "/documents");
      if (!currentWs || currentWs.workspace_id !== wsId) return;   // user switched meanwhile

      const body = $("docs");
      body.replaceChildren();
      docs.forEach((d) => {
        const tr = document.createElement("tr");
        const status = el("td", d.status, "st-" + d.status);
        if (d.status === "failed" && d.error) status.appendChild(el("div", d.error.slice(0, 120), "muted"));
        const actions = document.createElement("td");
        if (d.status === "done") {
          const b = el("button", "View markdown");
          b.onclick = () => viewMarkdown(d.doc_id);
          actions.appendChild(b);
          if (d.branches && d.branches.summary && d.branches.summary.status === "done") {
            const s = el("button", "View summary");
            s.onclick = () => viewSummary(d.doc_id);
            actions.append(" ", s);
          }
        }
        const hasFailedStep = Object.values(d.branches || {}).some((b) => b.status === "failed");
        if (hasFailedStep && (d.status === "done" || d.status === "failed")) {
          const r = el("button", "Retry failed steps");
          r.onclick = () => retryDoc(d.doc_id);
          actions.append(" ", r);
        }
        const steps = document.createElement("td");
        Object.entries(d.branches || {}).forEach(([name, b]) => {
          const chip = el("span", name + ": " + b.status, "chip st-" + b.status);
          if (b.error) chip.title = b.error;
          steps.appendChild(chip);
        });
        tr.append(el("td", d.filename), status, el("td", d.stage || ""), steps, actions);
        body.appendChild(tr);
      });
      schedulePoll(docs.some((d) => d.status === "pending" || d.status === "processing"));
    }

    async function upload(force) {
      if (!currentWs) return;
      const file = $("file").files[0];
      if (!file) { showErr(new Error("Choose a file first.")); return; }

      clearMessages();
      $("upload").disabled = $("force").disabled = true;
      try {
        const form = new FormData();
        form.append("file", file);
        form.append("force", force ? "true" : "false");
        const data = await api("/workspaces/" + currentWs.workspace_id + "/documents", {
          method: "POST", body: form,
        });
        if (data.duplicate) {
          $("note").textContent = "This file is already in this workspace (status: " + data.status +
                                  "). It was not processed again.";
          $("force").classList.remove("hidden");
        }
        await Promise.all([loadDocs(), refreshWorkspaces(currentWs.workspace_id)]);
      } catch (e) { showErr(e); }
      finally { $("upload").disabled = $("force").disabled = false; }
    }

    async function viewMarkdown(docId) {
      try {
        const data = await api("/workspaces/" + currentWs.workspace_id + "/documents/" + docId + "/markdown");
        const md = $("md");
        md.textContent = data.markdown;
        md.style.display = "block";
        md.scrollIntoView({ behavior: "smooth" });
      } catch (e) { showErr(e); }
    }

        async function viewSummary(docId) {
      try {
        const data = await api("/workspaces/" + currentWs.workspace_id + "/documents/" + docId + "/summary");
        const md = $("md");
        md.textContent = data.summary;
        md.style.display = "block";
        md.scrollIntoView({ behavior: "smooth" });
      } catch (e) { showErr(e); }
    }

    async function retryDoc(docId) {
      clearMessages();
      try {
        await api("/workspaces/" + currentWs.workspace_id + "/documents/" + docId + "/retry", { method: "POST" });
        await loadDocs();
      } catch (e) { showErr(e); }
    }
        function renderTable(headers, rows, emptyText) {
      const view = $("view");
      view.replaceChildren();
      if (!rows.length) { view.appendChild(el("p", emptyText, "muted")); return; }
      const table = document.createElement("table");
      const head = document.createElement("tr");
      headers.forEach((h) => head.appendChild(el("th", h)));
      table.appendChild(head);
      rows.forEach((cells) => {
        const tr = document.createElement("tr");
        cells.forEach((c) => tr.appendChild(el("td", c === null || c === undefined ? "" : String(c))));
        table.appendChild(tr);
      });
      view.appendChild(table);
      view.scrollIntoView({ behavior: "smooth" });
    }

    function eventDate(e) {
      let s = "";
      if (e.date_start) {
        s = e.date_start + (e.date_end ? " to " + e.date_end : "") + (e.is_ongoing ? " (ongoing)" : "");
      }
      if (e.date_text) s += (s ? "  [" : "") + e.date_text + (s ? "]" : "");
      return s;
    }

    async function showEvents() {
      if (!currentWs) return;
      clearMessages();
      try {
        const events = await api("/workspaces/" + currentWs.workspace_id + "/events");
        renderTable(
          ["Date", "Event", "Type", "File", "Source quote"],
          events.map((e) => [eventDate(e), e.title, e.event_type, e.filename, e.quote]),
          "No events found in this workspace."
        );
      } catch (err) { showErr(err); }
    }

    async function showGraph() {
      if (!currentWs) return;
      clearMessages();
      try {
        const q = $("graphQ").value.trim();
        const url = "/workspaces/" + currentWs.workspace_id + "/graph" + (q ? "?q=" + encodeURIComponent(q) : "");
        const g = await api(url);
        renderTable(
          ["From", "Relation", "To", "File", "Source quote"],
          g.relations.map((r) => [r.source + " (" + r.source_type + ")", r.relation,
                                  r.target + " (" + r.target_type + ")", r.filename, r.quote]),
          "No relations found."
        );
      } catch (err) { showErr(err); }
    }

    $("upload").onclick = () => upload(false);
    $("force").onclick = () => upload(true);
    $("file").onchange = clearMessages;
    $("showEvents").onclick = showEvents;
    $("showGraph").onclick = showGraph;

    refreshWorkspaces().catch((e) => { $("wsErr").textContent = e.message; });
  </script>
</body>
</html>
