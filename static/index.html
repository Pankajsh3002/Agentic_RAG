<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentic RAG</title>
  <link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body>
  <div id="banner" class="banner hidden" role="alert"></div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">Agentic RAG</div>

      <div class="side-field">
        <label for="wsSelect" class="muted small">Active workspace</label>
        <select id="wsSelect"></select>
        <div id="wsMeta" class="muted small"></div>
      </div>

      <nav class="nav" role="tablist" aria-label="Sections">
        <button class="nav-item active" role="tab" data-tab="workspaces">
          <span class="nav-icon" data-icon="layers"></span><span class="nav-label">Workspace</span>
        </button>
        <button class="nav-item" role="tab" data-tab="ask">
          <span class="nav-icon" data-icon="chat"></span><span class="nav-label">Query Document</span>
          <span id="askDot" class="dot hidden" title="Ready to query"></span>
        </button>
        <button class="nav-item" role="tab" data-tab="summary">
          <span class="nav-icon" data-icon="summary"></span><span class="nav-label">Summary</span>
        </button>
        <button class="nav-item" role="tab" data-tab="timeline">
          <span class="nav-icon" data-icon="clock"></span><span class="nav-label">Timelines</span>
        </button>
        <button class="nav-item" role="tab" data-tab="connections">
          <span class="nav-icon" data-icon="share"></span><span class="nav-label">Connections</span>
        </button>
      </nav>

      <p class="side-note">Each workspace is private to this browser. You can have 3 workspaces with 5 documents each. Do not upload confidential files: everything is deleted after 24 hours.</p>
    </aside>

    <div class="content">
      <div id="crumbs" class="crumbs"></div>

      <section id="tab-workspaces" class="tabpanel panel">
        <div class="row">
          <input type="text" id="wsName" placeholder="New workspace name" maxlength="80">
          <button id="wsCreate" class="primary">Create workspace</button>
        </div>
        <div id="wsErr" class="error"></div>
        <div id="wsCards" class="ws-list"></div>
      </section>

      <section id="tab-ask" class="tabpanel panel hidden">
        <div id="askBody"></div>
      </section>

      <section id="tab-summary" class="tabpanel panel hidden">
        <div class="split">
          <div id="sumList" class="list"></div>
          <div id="sumDetail" class="detail"></div>
        </div>
      </section>

      <section id="tab-timeline" class="tabpanel panel hidden">
        <div id="tlFilters" class="chips"></div>
        <div id="tlBody"></div>
      </section>

      <section id="tab-connections" class="tabpanel panel hidden">
        <div class="row">
          <input type="text" id="graphQ" placeholder="Filter by name (optional)" maxlength="100">
          <button id="graphSearch">Search</button>
        </div>
        <div id="graphBody"></div>
      </section>
    </div>
  </div>

  <input type="file" id="file" multiple hidden
         accept=".pdf,.doc,.docx,.html,.htm,.eml,.msg,.xml,.xlsx,.xls,.csv,.tsv,.png,.jpg,.jpeg,.tif,.tiff">

  <script src="/static/app.js?v=5"></script>
</body>
</html>
